<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>거제 반석교회 아이콘 미리보기</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: sans-serif;
        }
        .container {
            background-color: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        svg {
            width: 400px;
            height: 400px;
        }
        h2 {
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⛪ 거제 반석교회 새 아이콘 제안</h2>
        <!-- 실제 제작된 SVG 코드 -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <circle cx="256" cy="256" r="248" fill="white" stroke="#003D4C" stroke-width="2"/>
            <g transform="translate(80, 140) scale(1.8)">
                <path d="M5 0 L45 5 L40 40 L0 35 Z" fill="#8A9A0F" />
                <path d="M55 5 L85 0 L90 45 L60 50 Z" fill="#003D4C" />
                <path d="M0 50 L40 55 L45 140 L5 135 Z" fill="#003D4C" />
                <path d="M55 65 L90 55 L85 140 L50 145 Z" fill="#003D4C" />
            </g>
            <text x="270" y="245" font-family="sans-serif" font-weight="900" font-size="110" fill="#8A9A0F">반석</text>
            <text x="270" y="375" font-family="sans-serif" font-weight="900" font-size="110" fill="#003D4C">교회</text>
        </svg>
        <p style="margin-top: 20px; color: #666;">(브라우저에서 보이는 이 디자인이 실제 아이콘으로 적용됩니다)</p>
    </div>
</body>
</html>
